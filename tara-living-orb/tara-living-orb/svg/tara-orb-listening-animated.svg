<style>
.blob,.star,.bar{transform-box:fill-box;transform-origin:center}
.swirl,.core,.ring{transform-origin:100px 100px}
.b1{animation:d1 9s ease-in-out infinite alternate}
.b2{animation:d2 11s ease-in-out infinite alternate}
.b3{animation:d3 7s ease-in-out infinite alternate}
.b4{animation:d4 8s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(30px,-26px)}}
@keyframes d2{to{transform:translate(-34px,30px)}}
@keyframes d3{to{transform:translate(-28px,-30px)}}
